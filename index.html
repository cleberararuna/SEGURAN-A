<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OS - Segurança Eletrônica</title>
    <style>
        :root { --primary: #0f172a; --accent: #2563eb; --bg: #f8fafc; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); margin: 0; padding: 15px; color: #333; }
        .container { max-width: 600px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        h1 { color: var(--primary); font-size: 1.4rem; text-align: center; border-bottom: 2px solid var(--accent); padding-bottom: 10px; }
        .section-title { font-weight: bold; color: var(--accent); margin-top: 15px; margin-bottom: 8px; font-size: 1rem; }
        label { display: block; font-size: 0.85rem; margin-top: 8px; color: #555; }
        input, select, textarea { width: 100%; padding: 10px; margin-top: 4px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 0.95rem; }
        .checklist-item { display: flex; align-items: center; justify-content: space-between; background: #f1f5f9; padding: 10px; border-radius: 6px; margin-bottom: 8px; }
        .checklist-item span { font-size: 0.9rem; }
        .checklist-item select { width: 110px; margin-top: 0; }
        canvas { border: 1px dashed #aaa; width: 100%; height: 120px; border-radius: 6px; background: #fff; margin-top: 6px; }
        button { width: 100%; background: var(--accent); color: white; border: none; padding: 12px; border-radius: 6px; font-size: 1rem; font-weight: bold; cursor: pointer; margin-top: 15px; }
        button:hover { opacity: 0.9; }
        .btn-clear { background: #64748b; margin-top: 5px; padding: 6px; font-size: 0.8rem; }
    </style>
</head>
<body>

<div class="container">
    <h1>🛡️ OS - Segurança Eletrônica</h1>
    
    <form id="osForm">
        <div class="section-title">1. Dados do Cliente</div>
        <label>Nome / Condomínio / Empresa:</label>
        <input type="text" id="cliente" required placeholder="Ex: Condomínio Solar">
        
        <label>Técnico Responsável:</label>
        <input type="text" id="tecnico" required placeholder="Nome do Técnico">

        <label>Tipo de Serviço:</label>
        <select id="tipoServico">
            <option>Instalação Nova</option>
            <option>Manutenção Preventiva</option>
            <option>Manutenção Corretiva</option>
            <option>Vistoria / Orçamento</option>
        </select>

        <div class="section-title">2. Checklist de Equipamentos</div>
        
        <div class="checklist-item">
            <span>CFTV: Imagem / Lentes / Foco</span>
            <select><option>OK</option><option>Defeito</option><option>N/A</option></select>
        </div>
        <div class="checklist-item">
            <span>DVR/NVR: HD e Gravação</span>
            <select><option>OK</option><option>Defeito</option><option>N/A</option></select>
        </div>
        <div class="checklist-item">
            <span>Alarme: Sensores e Bateria</span>
            <select><option>OK</option><option>Defeito</option><option>N/A</option></select>
        </div>
        <div class="checklist-item">
            <span>Cerca Elétrica: Tensão / Aterramento</span>
            <select><option>OK</option><option>Defeito</option><option>N/A</option></select>
        </div>
        <div class="checklist-item">
            <span>Controle Acesso: Leitores e Fechaduras</span>
            <select><option>OK</option><option>Defeito</option><option>N/A</option></select>
        </div>

        <div class="section-title">3. Peças / Serviços Realizados</div>
        <textarea id="observacoes" rows="3" placeholder="Ex: Trocado conector BNC na câmera 02, passado 15m de cabo UTP..."></textarea>

        <div class="section-title">4. Assinatura do Cliente</div>
        <canvas id="signature-pad"></canvas>
        <button type="button" class="btn-clear" onclick="clearSignature()">Limpar Assinatura</button>

        <button type="submit">Finalizar e Imprimir / Gerar PDF</button>
    </form>
</div>

<script>
    const canvas = document.getElementById('signature-pad');
    const ctx = canvas.getContext('2d');
    let writing = false;

    canvas.width = canvas.offsetWidth;
    canvas.height = canvas.offsetHeight;

    const startDrawing = (e) => { writing = true; ctx.beginPath(); draw(e); };
    const stopDrawing = () => { writing = false; ctx.beginPath(); };
    const draw = (e) => {
        if (!writing) return;
        const rect = canvas.getBoundingClientRect();
        const x = (e.clientX || e.touches[0].clientX) - rect.left;
        const y = (e.clientY || e.touches[0].clientY) - rect.top;
        ctx.lineWidth = 2;
        ctx.lineCap = 'round';
        ctx.strokeStyle = '#000';
        ctx.lineTo(x, y);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(x, y);
    };

    canvas.addEventListener('mousedown', startDrawing);
    canvas.addEventListener('mouseup', stopDrawing);
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('touchstart', startDrawing);
    canvas.addEventListener('touchend', stopDrawing);
    canvas.addEventListener('touchmove', draw);

    function clearSignature() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    document.getElementById('osForm').addEventListener('submit', function(e) {
        e.preventDefault();
        alert('Ordem de Serviço registrada com sucesso!');
        window.print();
    });
</script>

</body>
</html>
